<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  
  <!-- Subtle decorative rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Outer accent badge -->
  <rect x="76" y="76" width="360" height="360" rx="90" fill="#1e293b" stroke="#334155" stroke-width="6" />

  <!-- Rupee Symbol in Emerald -->
  <path d="M190 170 h132 M190 215 h132 M190 170 v145 c0 20 15 35 35 35 h35 l50 65" 
        fill="none" 
        stroke="url(#emeraldGrad)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  <path d="M190 260 h80 c25 0 45 -20 45 -45 s-20 -45 -45 -45" 
        fill="none" 
        stroke="url(#emeraldGrad)" 
        stroke-width="32" 
        stroke-linecap="round" />

  <!-- Anson & Dona pill -->
  <g transform="translate(146, 395)">
    <rect width="220" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
    <text x="110" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="2">ANSON &amp; DONA</text>
  </g>
</svg>
